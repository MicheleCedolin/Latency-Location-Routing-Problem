name: Restarts

# Equal-CPU comparison of ONE long run with k pooled short runs (route pool + exact DP + set partitioning).  Post-hoc, no experiments.
#   short = 1x archive, long = ext10 archive (10x the budget), k = 10 by default.                -> analysis/restart_pool.py
# Results: job summary and branch `analysis-results` (restarts/latest, restarts/runs/<run id>).
on:
  workflow_dispatch:
    inputs:
      short_archive:
        description: 'Archive of the short runs (repository path or https URL)'
        default: 'study_results/final_1x_tuned.tar.gz'
      long_archive:
        description: 'Archive of the long runs (repository path or https URL)'
        default: 'study_results/ext10_tuned.tar.gz'
      k:
        description: 'Number of short runs that cost as much as one long run'
        default: '10'
      draws:
        description: 'Random draws of k short runs per instance'
        default: '10'
      instances:
        description: 'Optional comma-separated instance subset (default: all common instances)'
        default: ''

permissions:
  contents: write

jobs:
  restarts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - run: g++ -O2 -shared -fPIC -o analysis/libdp_latency.so analysis/dp_latency.cpp
      - name: Unpack the archives
        run: |
          i=0
          for a in "${{ inputs.short_archive }}" "${{ inputs.long_archive }}"; do
            i=$((i + 1)); mkdir -p /tmp/t$i
            case "$a" in http*) curl -fsSL -o /tmp/a$i.tgz "$a"; f=/tmp/a$i.tgz ;; *) f="$a" ;; esac
            tar xzf "$f" -C /tmp/t$i
          done
      - name: Compare
        env:
          INSTANCES: ${{ inputs.instances }}
        run: |
          inst=""; [ -n "$INSTANCES" ] && inst="--instances $INSTANCES"
          python analysis/restart_pool.py /tmp/t1 /tmp/t2 --k ${{ inputs.k }} --draws ${{ inputs.draws }} --jobs 4 $inst --out out 2> restarts.log || { tail -30 restarts.log; exit 1; }
      - name: Job summary
        run: cat out/restart_pool_summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the results to the branch analysis-results
        run: |
          out="restarts/runs/${{ github.run_id }}"
          rm -rf /tmp/res && mkdir /tmp/res && cd /tmp/res
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin analysis-results; then git checkout -q -b analysis-results FETCH_HEAD; else git checkout -q --orphan analysis-results; fi
          mkdir -p "$out"; cp "$GITHUB_WORKSPACE"/out/* "$out"/
          printf 'short: %s\nlong: %s\nk: %s\ndraws: %s\ninstances: %s\ncommit: %s\nrun: %s/%s/actions/runs/%s\n' \
            "${{ inputs.short_archive }}" "${{ inputs.long_archive }}" "${{ inputs.k }}" "${{ inputs.draws }}" "${{ inputs.instances }}" "${{ github.sha }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" > "$out/INPUTS.txt"
          rm -rf restarts/latest && mkdir -p restarts/latest && cp "$out"/* restarts/latest/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Restarts comparison of run ${{ github.run_id }}"
          git push -q origin analysis-results
