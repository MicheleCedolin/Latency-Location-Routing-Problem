name: CI

# Build, self-check of the C++ engine and unit tests of the Python kit.
# Runs on every push / pull request; takes a few minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ build + selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (llrp_fast, llrp_tools)
        working-directory: cpp
        run: ./build.sh
      - name: Strict C++11 syntax check
        working-directory: cpp
        run: |
          g++ -std=c++11 -pedantic-errors -Wall -fsyntax-only src/llrp_fast.cpp
          g++ -std=c++11 -pedantic-errors -fsyntax-only src/llrp_tools.cpp
      - name: Selfcheck (--check, verifier, determinism, run_config/merge, irace dry run)
        working-directory: cpp
        run: ./selfcheck.sh
      - name: Instance data check
        working-directory: cpp
        run: ./check_inst_data.sh
      - name: Engine versus exact optima on tiny random instances
        run: python3 -I python/tools/exact_vs_engine.py --instances 40 --seeds 5

  python:
    name: Python kit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional dependencies (numpy, scipy)
        run: python -m pip install numpy scipy
      - name: Unit tests
        working-directory: python
        run: python -I -m unittest discover -s tests
      - name: Launcher smoke tests
        working-directory: python
        run: |
          bash tests/smoke_hpc.sh
          bash tests/smoke_shards.sh

  docs:
    name: Web guide (docs/) build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: docs/index.html is up to date with docs/src
        run: python3 docs/build.py --check
      - name: Engine tests (Node)
        run: node docs/test/engine.test.mjs
      - name: Page smoke test (jsdom)
        run: |
          npm install --prefix "$RUNNER_TEMP/jsd" jsdom --no-audit --no-fund --silent
          JSDOM_FROM="$RUNNER_TEMP/jsd" node docs/test/dom.test.mjs

  bks:
    name: BKS table, literature results, analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: literature_results.csv is consistent with LLRP_BKS.csv
        run: python3 -I bks/check_literature.py
      - name: Comparison script on the archived 1x results
        run: |
          tar xzf study_results/final_1x_tuned.tar.gz -C "$RUNNER_TEMP"
          python3 -I bks/compare_published.py "$RUNNER_TEMP"/results_final/*/tuned/summary.csv | tee "$RUNNER_TEMP/cmp.txt"
          grep -q "^76 instances" "$RUNNER_TEMP/cmp.txt"
      - name: Extended-budget report on the archived 1x and ext10 results
        run: |
          tar xzf study_results/ext10_tuned.tar.gz -C "$RUNNER_TEMP"
          python3 -I analysis/test_report.py
          python3 -I analysis/test_depot_decomp.py
          python3 -I analysis/ext10_report.py --base "$RUNNER_TEMP/results_final" --ext "$RUNNER_TEMP/results_extended10" | tee "$RUNNER_TEMP/ext.txt"
          grep -q "1740/1740 pairs agree" "$RUNNER_TEMP/ext.txt"
          grep -Eq "^ +ALL +58 \| +21/58 +29/58" "$RUNNER_TEMP/ext.txt"

  paper:
    name: Paper tables and figures (regenerated from the archived results)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r paper/requirements.txt
      - name: Unit tests
        run: python3 paper/tests/test_paper.py
      - name: Regenerate all tables, numbers and figures
        run: paper/run_all.sh "$RUNNER_TEMP/paper"
      - name: Tables and quoted numbers equal the recorded checksums
        run: cd "$RUNNER_TEMP/paper/out/tables" && sha256sum -c "$GITHUB_WORKSPACE/paper/expected/SHA256SUMS"
      - name: Six figures were written
        run: test "$(ls "$RUNNER_TEMP"/paper/out/figs/*.pdf | wc -l)" -eq 6

  large_ablation:
    name: Large-instance ablation runner (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r large_ablation/requirements.txt
      - name: Checksums of the modules and instance workbooks
        working-directory: large_ablation
        run: sha256sum -c CHECKSUMS.sha256
      - name: Smoke test (2 seeds x 3 iterations, determinism, resume, aggregate)
        working-directory: large_ablation
        run: python tests/test_smoke.py

  analysis:
    name: Analysis scripts (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy, scipy
        run: python -m pip install numpy scipy
      - name: Pool + DP + SP and equal-time scripts on the --atmost archive
        run: |
          mkdir -p "$RUNNER_TEMP/t" && tar xzf study_results/atmost_50-5-2BIS-5.tar.gz -C "$RUNNER_TEMP/t"
          python analysis/pool_sp.py "$RUNNER_TEMP/t" --out "$RUNNER_TEMP/o" 2>/dev/null
          python analysis/anytime_at_tavg.py "$RUNNER_TEMP/t" --out "$RUNNER_TEMP/o"
          grep -q "SP solutions that failed the independent audit: 0" "$RUNNER_TEMP/o/pool_sp_summary.md"
          grep -q "recomputed latency differs from \`Total Latency\` by > 1e-6 (relative): 0" "$RUNNER_TEMP/o/pool_sp_summary.md"
