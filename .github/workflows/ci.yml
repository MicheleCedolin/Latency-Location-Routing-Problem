name: CI

# Build and self-check of the C++ engine, consistency of the published-results tables, regeneration of the paper tables from the archives.
# Runs on every push / pull request; takes a few minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cpp:
    name: C++ build + selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (llrp_fast, llrp_tools)
        working-directory: cpp
        run: ./build.sh
      - name: Strict C++11 syntax check
        working-directory: cpp
        run: |
          g++ -std=c++11 -pedantic-errors -Wall -fsyntax-only src/llrp_fast.cpp
          g++ -std=c++11 -pedantic-errors -fsyntax-only src/llrp_tools.cpp
      - name: Selfcheck (--check, verifier, determinism, run_config/merge, irace dry run)
        working-directory: cpp
        run: ./selfcheck.sh
      - name: Instance data check
        working-directory: cpp
        run: ./check_inst_data.sh

  bks:
    name: BKS table, literature results, analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: literature_results.csv is consistent with LLRP_BKS.csv
        run: python3 -I bks/check_literature.py
      - name: Comparison script on the archived 1x results
        run: |
          tar xzf study_results/final_1x_tuned.tar.gz -C "$RUNNER_TEMP"
          python3 -I bks/compare_published.py "$RUNNER_TEMP"/results_final/*/tuned/summary.csv | tee "$RUNNER_TEMP/cmp.txt"
          grep -q "^76 instances" "$RUNNER_TEMP/cmp.txt"
      - name: Extended-budget report on the archived 1x and ext10 results
        run: |
          tar xzf study_results/ext10_tuned.tar.gz -C "$RUNNER_TEMP"
          python3 -I analysis/test_report.py
          python3 -I analysis/test_depot_decomp.py
          python3 -I analysis/ext10_report.py --base "$RUNNER_TEMP/results_final" --ext "$RUNNER_TEMP/results_extended10" | tee "$RUNNER_TEMP/ext.txt"
          grep -q "1740/1740 pairs agree" "$RUNNER_TEMP/ext.txt"
          grep -Eq "^ +ALL +58 \| +21/58 +29/58" "$RUNNER_TEMP/ext.txt"

  paper:
    name: Paper tables and figures (regenerated from the archived results)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r paper/requirements.txt
      - name: Unit tests
        run: python3 paper/tests/test_paper.py
      - name: Regenerate all tables, numbers and figures
        run: paper/run_all.sh "$RUNNER_TEMP/paper"
      - name: Tables and quoted numbers equal the recorded checksums
        run: cd "$RUNNER_TEMP/paper/out/tables" && sha256sum -c "$GITHUB_WORKSPACE/paper/expected/SHA256SUMS"
      - name: Six figures were written
        run: test "$(ls "$RUNNER_TEMP"/paper/out/figs/*.pdf | wc -l)" -eq 6

  analysis:
    name: Equal-time analysis script (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy, scipy
        run: python -m pip install numpy scipy
      - name: Equal-time script on the --atmost archive
        run: |
          mkdir -p "$RUNNER_TEMP/t" && tar xzf study_results/atmost_50-5-2BIS-5.tar.gz -C "$RUNNER_TEMP/t"
          python analysis/anytime_at_tavg.py "$RUNNER_TEMP/t" --out "$RUNNER_TEMP/o"
          test -s "$RUNNER_TEMP/o/anytime_at_tavg_summary.md"

  replay:
    name: Archives are reproduced by the engine of this repository (replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: cpp
        run: ./build.sh
      - name: Replay the cheapest runs of the archives of stages 2 and 4
        run: |
          python3 -I analysis/replay_archive.py study_results/final_1x_tuned.tar.gz --flags cpp/stages/1_base.flags --n-runs 3 --jobs 3
          python3 -I analysis/replay_archive.py study_results/ext10_tuned.tar.gz --flags cpp/stages/1_base.flags --n-runs 3 --jobs 3
          python3 -I analysis/replay_archive.py study_results/atmost_50-5-2BIS-5.tar.gz --flags cpp/irace/atmost.flags --n-runs 2 --jobs 2
          python3 -I analysis/replay_archive.py study_results/b1_tuned.tar.gz --flags cpp/stages/3_pool.flags --n-runs 3 --jobs 3

  memetic:
    name: Memetic-phase analysis is regenerated from the archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scipy
        run: python -m pip install scipy
      - name: Regenerate the pre-registered analysis (criteria P1, P2, P3, S) and compare with the reference
        run: |
          T="$RUNNER_TEMP/m"; mkdir -p "$T"
          tar xzf study_results/memetic_tuned.tar.gz -C "$T"
          tar xzf study_results/b1_tuned.tar.gz -C "$T"
          python3 -I analysis/memetic/analyze_y.py --res "$T/results_memetic" --control "$T/results_b1" --manifest cpp/manifest.tsv \
              --literature bks/literature_results.csv --ext-list analysis/memetic/instances_ext.txt --rest-list analysis/memetic/instances_rest14.txt --out "$T/out"
          diff "$T/out/y_summary.md" analysis/memetic/reference/y_summary.md
          diff "$T/out/y_instances.csv" analysis/memetic/reference/y_instances.csv
          grep -q "FULL-SET ADOPTION CANDIDATE" "$T/out/y_summary.md"
