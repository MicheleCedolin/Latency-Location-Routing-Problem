name: Edges

# Edge structure of final solutions (neighbour rank of every route edge, which edges of the published solutions of Zou et al. our runs
# never use, coverage by candidate edge sets).  Post-hoc, no experiments.   -> analysis/edge_granularity.py, edge_candidates.py, edge_summary.py
# Results: job summary and branch `analysis-results` (edges/latest, edges/runs/<run id>).
on:
  workflow_dispatch:
    inputs:
      archives:
        description: 'Result archives, space separated (repository paths or https URLs)'
        default: 'study_results/final_1x_tuned.tar.gz study_results/ext10_tuned.tar.gz study_results/b1_tuned.tar.gz'
      cand_algs:
        description: 'Algorithm labels for the candidate-set coverage (space separated)'
        default: 'ext10 B1'

permissions:
  contents: write

jobs:
  edges:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Unpack the archives and clone the published solutions
        run: |
          mkdir -p /tmp/trees; i=0
          for a in ${{ inputs.archives }}; do
            i=$((i + 1)); mkdir -p /tmp/trees/$i
            case "$a" in http*) curl -fsSL -o /tmp/a$i.tgz "$a"; f=/tmp/a$i.tgz ;; *) f="$a" ;; esac
            tar xzf "$f" -C /tmp/trees/$i
          done
          git clone --depth 1 https://github.com/YujiZou/LLRP /tmp/zou
      - name: Analyse
        run: |
          python analysis/edge_granularity.py --published /tmp/zou/solutions --ours /tmp/trees/* --out out/granularity
          dirs=""
          for alg in ${{ inputs.cand_algs }}; do
            python analysis/edge_candidates.py --published /tmp/zou/solutions --ours /tmp/trees/* --alg "$alg" --out "out/cand_$alg"
            dirs="$dirs out/cand_$alg"
          done
          python analysis/edge_summary.py out/granularity $dirs > out/edges_summary.md
      - name: Job summary
        run: cat out/edges_summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the results to the branch analysis-results
        run: |
          out="edges/runs/${{ github.run_id }}"
          rm -rf /tmp/res && mkdir /tmp/res && cd /tmp/res
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin analysis-results; then git checkout -q -b analysis-results FETCH_HEAD; else git checkout -q --orphan analysis-results; fi
          mkdir -p "$out"; cp -r "$GITHUB_WORKSPACE"/out/* "$out"/
          printf 'archives: %s\ncand_algs: %s\ncommit: %s\nrun: %s/%s/actions/runs/%s\n' "${{ inputs.archives }}" "${{ inputs.cand_algs }}" "${{ github.sha }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" > "$out/INPUTS.txt"
          rm -rf edges/latest && mkdir -p edges/latest && cp -r "$out"/* edges/latest/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Edge analysis of run ${{ github.run_id }}"
          git push -q origin analysis-results
