name: Backbone

# Do the routes of the published solutions (Zou et al. 2024) appear (a) in the pool of the final routes of our runs and (b) among the
# routes that can be built from the edges most of our runs share?  Pure post-hoc analysis, no experiments.   -> analysis/backbone_sp.py
# Results: job summary and branch `analysis-results` (backbone/latest, backbone/runs/<run id>).
on:
  workflow_dispatch:
    inputs:
      archive:
        description: 'Result archive (repository path or https URL)'
        default: 'study_results/ext10_tuned.tar.gz'
      alg:
        description: 'Algorithm label inside the archive'
        default: 'ext10'
      minfreqs:
        description: 'Edge-frequency thresholds (space separated): keep edges used by at least this many runs'
        default: '3 5 8'
      instances:
        description: 'Optional comma-separated instance subset (default: all)'
        default: ''
      run_sp:
        description: 'Also solve the set partitioning over the enumerated columns (slow)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backbone:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Build the C++ helpers
        run: |
          g++ -O2 -shared -fPIC -o analysis/libdp_latency.so analysis/dp_latency.cpp
          g++ -O2 -std=c++11 -o analysis/enum_paths analysis/enum_paths.cpp
      - name: Unpack the archive and clone the published solutions
        run: |
          mkdir -p /tmp/tree
          case "${{ inputs.archive }}" in
            http*) curl -fsSL -o /tmp/a.tgz "${{ inputs.archive }}"; f=/tmp/a.tgz ;;
            *) f="${{ inputs.archive }}" ;;
          esac
          tar xzf "$f" -C /tmp/tree
          git clone --depth 1 https://github.com/YujiZou/LLRP /tmp/zou
      - name: Enumerate, diagnose (one process per threshold)
        env:
          INSTANCES: ${{ inputs.instances }}
          RUN_SP: ${{ inputs.run_sp }}
        run: |
          mkdir -p out
          for t in ${{ inputs.minfreqs }}; do
            inst=""; [ -n "$INSTANCES" ] && inst="--instances $INSTANCES"
            sp="--no-sp"; [ "$RUN_SP" = "true" ] && sp=""
            python analysis/backbone_sp.py /tmp/tree --published /tmp/zou/solutions --alg "${{ inputs.alg }}" --minfreq "$t" \
              --maxcols 3000000 $sp $inst --out "out/mf$t" > "out/mf$t.log" 2>&1 &
          done
          wait
          for t in ${{ inputs.minfreqs }}; do tail -3 "out/mf$t.log"; test -s "out/mf$t/backbone_sp_summary.md"; done
      - name: Job summary
        run: for t in ${{ inputs.minfreqs }}; do cat "out/mf$t/backbone_sp_summary.md"; echo; done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the results to the branch analysis-results
        run: |
          out="backbone/runs/${{ github.run_id }}"
          rm -rf /tmp/res && mkdir /tmp/res && cd /tmp/res
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin analysis-results; then git checkout -q -b analysis-results FETCH_HEAD; else git checkout -q --orphan analysis-results; fi
          mkdir -p "$out"
          cp -r "$GITHUB_WORKSPACE"/out/mf* "$out"/
          printf 'archive: %s\nalg: %s\nminfreqs: %s\ninstances: %s\nrun_sp: %s\ncommit: %s\nrun: %s/%s/actions/runs/%s\n' \
            "${{ inputs.archive }}" "${{ inputs.alg }}" "${{ inputs.minfreqs }}" "${{ inputs.instances }}" "${{ inputs.run_sp }}" "${{ github.sha }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" > "$out/INPUTS.txt"
          rm -rf backbone/latest && mkdir -p backbone/latest && cp -r "$out"/* backbone/latest/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Backbone analysis of run ${{ github.run_id }}"
          git push -q origin analysis-results
